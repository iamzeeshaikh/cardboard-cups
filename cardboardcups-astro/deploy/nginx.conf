# Serve dist/client. Assumes TLS terminates here and /api/quote/ is proxied to
# the node server started by `node dist/server/entry.mjs`.

server {
  listen 80;
  server_name cardboardcups.com www.cardboardcups.com;
  return 301 https://cardboardcups.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.cardboardcups.com;
  return 301 https://cardboardcups.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name cardboardcups.com;
  root /var/www/cardboardcups/dist/client;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; upgrade-insecure-requests" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # canonical trailing slash
  rewrite ^([^.]*[^/])$ $1/ permanent;

  location = /cart/      { return 301 /get-free-quote/; }
  location = /checkout/  { return 301 /get-free-quote/; }
  location = /my-account/ { return 301 /contact-us/; }
  location ^~ /brand/cardboard-cups { return 301 /shop/; }

  location /api/ {
    proxy_pass http://127.0.0.1:4321;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $scheme://$host;
  }

  location ~* ^/(wp-content/uploads|fonts|_astro)/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html { internal; }
}
